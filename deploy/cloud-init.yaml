#cloud-config
# Cloud-init bootstrap for trinket-oss on a fresh Ubuntu 24.04 DigitalOcean droplet.
# Runs once on first boot. Result: trinket reachable at https://${DOMAIN} with
# Python 3 / Java / R server-side languages routed through Caddy to the local
# Piston sandbox container.
#
# Placeholders are filled in by provision.sh before the droplet is created:
#   __DOMAIN__            -> your hostname, e.g. freetrinket.io
#   __ACME_EMAIL__        -> Let's Encrypt notification email
#   __SESSION_SECRET__    -> 48-char random session cookie secret
#   __REPO_URL__          -> your trinket-oss fork (e.g. https://github.com/StriveMath/trinket-oss.git)
#   __REPO_BRANCH__       -> branch to deploy (e.g. main)

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban
  - git

write_files:
  - path: /opt/trinket/.env
    permissions: "0600"
    content: |
      DOMAIN=__DOMAIN__
      ACME_EMAIL=__ACME_EMAIL__

  - path: /opt/trinket/local.yaml.tpl
    permissions: "0600"
    content: |
      # Generated by cloud-init. Edit /opt/trinket/repo/config/local.yaml on
      # the droplet to make environment-specific changes. This template only
      # supplies the secrets + hostname that can't live in git.
      app:
        url:
          protocol: https
          hostname: __DOMAIN__
          port: 443
        plugins:
          session:
            cookieOptions:
              password: '__SESSION_SECRET__'
              domain: ''
              isSecure: true
        embed:
          skulpt:
            local: true
            min: true
        serverside:
          python3:
            api:
              default: 'https://__DOMAIN__/python3'
          java8:
            api:
              default: 'https://__DOMAIN__/java'
          r3:
            api:
              default: 'https://__DOMAIN__/r'

      features:
        trinkets:
          html: true
          blocks: true
          glowscript: true
          glowscript-blocks: true
          console: true
          music: true
          python3: true
          java: true
          R: true

      db:
        mongo:
          host: mongodb
          port: 27017
          database: trinket
        redis:
          enabled: false

  - path: /opt/trinket/setup.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail

      # --- Docker install (official repo) ---
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update -y
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker

      # --- Firewall ---
      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw allow 443/udp
      ufw --force enable

      # --- Clone your trinket-oss fork ---
      cd /opt/trinket
      if [ ! -d repo ]; then
        git clone --depth 1 --branch __REPO_BRANCH__ __REPO_URL__ repo
      fi

      # --- Install per-environment config ---
      cp /opt/trinket/local.yaml.tpl repo/config/local.yaml
      cp /opt/trinket/.env repo/.env

      # --- Build & start (uses base + override + prod compose files) ---
      cd repo
      docker compose -f docker-compose.yml \
                     -f docker-compose.override.yml \
                     -f docker-compose.prod.yml \
                     build
      docker compose -f docker-compose.yml \
                     -f docker-compose.override.yml \
                     -f docker-compose.prod.yml \
                     up -d

      # --- systemd unit so the stack restarts on reboot ---
      cat > /etc/systemd/system/trinket.service <<UNIT
      [Unit]
      Description=Trinket OSS (docker compose)
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/trinket/repo
      EnvironmentFile=/opt/trinket/repo/.env
      ExecStart=/usr/bin/docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml up -d
      ExecStop=/usr/bin/docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml down

      [Install]
      WantedBy=multi-user.target
      UNIT
      systemctl daemon-reload
      systemctl enable trinket.service

runcmd:
  - [ bash, -lc, "/opt/trinket/setup.sh 2>&1 | tee /var/log/trinket-setup.log" ]

final_message: "Trinket cloud-init finished after $UPTIME seconds. Check /var/log/trinket-setup.log."
